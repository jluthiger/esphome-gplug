<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12160e">
<title>gPlug Setup</title>
<!-- Home-screen shortcut: name and icon. A real PWA install needs HTTPS, which the device does not
     serve, so Chrome offers "create shortcut" only; see spa/README.md. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="gPlug">
<style>/*CSS*/</style>
<!-- Desktop layer, scoped by the media attribute rather than by an @media inside the file, so the
     rules cannot apply on a phone even if the query is edited away by mistake. -->
<style media="(min-width:800px)">/*CSS-DESKTOP*/</style>
</head>
<body>
<div id="app"></div>
<script>/*JS*/</script>
</body>
</html>
