# gPlug ESPHome firmware – PoC. One image for gPlugD / D-E / K / M; pins and meter descriptor are runtime data.
#
# This file is self-contained on purpose: it is the package other people's ESPHome Device Builders
# pull in when they adopt a gPlug (dashboard_import below), so it must not reference anything
# relative to a config directory -- components come from git, the SPA and presets are bundled
# inside the component, the partition table is inline. For local development use dev.yaml, which
# includes this file and overrides the component source with the working tree.
substitutions:
  name: gplug
  friendly_name: gPlug
  # Optional OTA password, shared by native OTA (Device Builder / `esphome upload`) and the
  # browser upload form (`/update`, HTTP Basic auth, user "admin"). Empty = no auth: anyone on the
  # LAN can flash the device. Override in the adopting config's substitutions or with
  # `esphome -s ota_password <pw> ...`.
  ota_password: ""
  # Image version, reported in the app (Setup tab) and shown in an ESPHome dashboard. The release
  # workflow overrides it with the tag (`esphome -s version 1.2.3 compile dev.yaml`); a local
  # build keeps the value below.
  version: "0.1.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.0
  # project + dashboard_import together make the device show up under "Discovered" in any ESPHome
  # Device Builder on the LAN (both are required, see esphome/zeroconf.py DashboardImportDiscovery).
  project:
    name: jluthiger.gplug
    version: ${version}

dashboard_import:
  package_import_url: github://jluthiger/esphome-gplug/firmware/gplug.yaml@main
  import_full_config: false

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
  # ESPHome's standard ESP-IDF layout (otadata, phy_init, app0 @ 0x10000, app1, nvs 448 kB) plus our
  # history store appended at the end. App slots come out at 1408 kB each. `esphome run` works
  # unmodified with this layout (it hardcodes the 0x10000 app offset).
  partitions:
    - name: data
      type: data
      subtype: spiffs
      size: 0xB0000   # 704 kB: 15-min history, 20 B/record, 204 per 4 kB sector -> ~374 days

external_components:
  - source:
      type: git
      url: https://github.com/jluthiger/esphome-gplug
      ref: main
      path: firmware/components
    refresh: 1d

logger:
  level: INFO
  baud_rate: 115200

wifi:
  power_save_mode: light
  ap:
    ssid: "gPlug-Setup"

captive_portal:

api:
  # Encryption pulls in mbedtls (Noise protocol), which gplug_smi also needs for AES-GCM.
  # Without this, ESP-IDF never links mbedtls and mbedtls_gcm_* is an undefined reference at link
  # time (found by trying to compile without it first). Placeholder key -- an adopting dashboard
  # generates its own and overrides this.
  encryption:
    key: "jxc9G0UKLtu5pAfuNeTDpDU58d/jtLPkX1L7QEeKY0E="
  # ESPHome reboots the device when no API client has connected for `reboot_timeout` (default
  # 15 min): sensible for a device that exists to feed Home Assistant and is useless without it,
  # wrong for this one. A gPlug is standalone by design -- it serves its own app and logs to its
  # own flash -- so on any installation without Home Assistant the default rebooted it every
  # 15 minutes, forever (APIServer::loop(), "No clients; rebooting"). That cost the in-flight
  # quarter hour every time, marked every stored record as a partial interval after a restart,
  # and kept the live ring from ever holding more than a few minutes.
  # 0s disables it. Home Assistant users lose nothing: this only ever rebooted when HA was absent.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}   # empty still compiles the auth path, just skips the handshake

# Timezone pinned: the CSV export (/api/history.csv) prints local interval times and must not
# depend on the timezone of whichever machine compiled the image (ESPHome's default).
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zurich

# HAN input. Pin/baud are defaults only; gplug_smi reconfigures at runtime from the stored descriptor.
uart:
  id: han_uart
  rx_pin: GPIO4
  baud_rate: 115200
  rx_buffer_size: 2048

# SPA and presets default to the copies bundled in the component.
gplug_smi:
  uart_id: han_uart
  ota_password: ${ota_password}
