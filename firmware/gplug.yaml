# gPlug ESPHome firmware – PoC. One image for gPlugD / D-E / K / M; pins and meter descriptor are runtime data.
#
# This file is self-contained on purpose: it is the package other people's ESPHome Device Builders
# pull in when they adopt a gPlug (dashboard_import below), so it must not reference anything
# relative to a config directory -- components come from git, the SPA and presets are bundled
# inside the component, the partition table is inline. For local development use dev.yaml, which
# includes this file and overrides the component source with the working tree.
substitutions:
  name: gplug
  friendly_name: gPlug
  # Optional OTA password, shared by native OTA (Device Builder / `esphome upload`) and the
  # browser upload form (`/update`, HTTP Basic auth, user "admin"). Empty = no auth: anyone on the
  # LAN can flash the device. Override in the adopting config's substitutions or with
  # `esphome -s ota_password <pw> ...`.
  ota_password: ""
  # Release manifest the firmware card's "Check for updates" reads (GitHub Pages, stable releases
  # only; see .github/workflows/release.yml). Fetched only when the user asks, never on a schedule.
  update_manifest: https://jluthiger.github.io/esphome-gplug/manifest.json
  # Image version, reported in the app (Setup tab, `fw` in /api/status), compared against the
  # release manifest by the update check, and shown in an ESPHome Device Builder.
  # On main it is the next release with -dev, so a development build never passes for a release;
  # a release commit sets it to the tag's version, together with the component `ref` below
  # (.github/release-check.sh, README.md "Cutting a release").
  version: "0.6.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # One image runs on every gPlug, so a fixed name made two of them in one WLAN fight over
  # gplug.local (issue #9). The suffix is the last three MAC bytes: gplug-a1b2c3.local. Adopting in a
  # Device Builder turns it off again and bakes the discovered, already suffixed name into the
  # config (esphome/components/dashboard_import), so an adopted device keeps its address.
  name_add_mac_suffix: true
  min_version: 2026.6.0
  # project + dashboard_import together make the device show up under "Discovered" in any ESPHome
  # Device Builder on the LAN (both are required, see esphome/zeroconf.py DashboardImportDiscovery).
  project:
    name: jluthiger.gplug
    version: ${version}

# Adopting a discovered gPlug pulls this file from `stable`, which the release workflow moves to
# each release -- so a Device Builder builds released code, not whatever is on main today.
dashboard_import:
  package_import_url: github://jluthiger/esphome-gplug/firmware/gplug.yaml@stable
  import_full_config: false

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
  # ESPHome's standard ESP-IDF layout (otadata, phy_init, app0 @ 0x10000, app1, nvs 448 kB) plus our
  # history store appended at the end. App slots come out at 1408 kB each. `esphome run` works
  # unmodified with this layout (it hardcodes the 0x10000 app offset).
  partitions:
    - name: data
      type: data
      subtype: spiffs
      size: 0xB0000   # 704 kB: 15-min history, 20 B/record, 204 per 4 kB sector -> ~374 days

external_components:
  - source:
      type: git
      url: https://github.com/jluthiger/esphome-gplug
      # main on main; v<version> in a release commit, so the gplug.yaml on `stable` and the component
      # it builds are always from the same tag.
      ref: v0.6.0
      path: firmware/components
    # Fetched on every build. With a cache (it was 1d) the component and this file -- which an
    # adopting config pulls as a package with its own cache -- could come from different commits: a
    # refreshed gplug.yaml naming the `gplug_smi` sensor platform against a cached component that
    # predates it failed with "Platform not found: 'sensor.gplug_smi'" (2026-09-14). Costs a git
    # fetch per build and needs GitHub reachable while compiling.
    refresh: 0s

logger:
  level: INFO
  baud_rate: 115200

wifi:
  power_save_mode: light
  ap:
    ssid: "gPlug-Setup"

captive_portal:

api:
  # Encryption pulls in mbedtls (Noise protocol), which gplug_smi also needs for AES-GCM.
  # Without this, ESP-IDF never links mbedtls and mbedtls_gcm_* is an undefined reference at link
  # time (found by trying to compile without it first). Placeholder key -- an adopting dashboard
  # generates its own and overrides this.
  encryption:
    key: "jxc9G0UKLtu5pAfuNeTDpDU58d/jtLPkX1L7QEeKY0E="
  # ESPHome reboots the device when no API client has connected for `reboot_timeout` (default
  # 15 min): sensible for a device that exists to feed Home Assistant and is useless without it,
  # wrong for this one. A gPlug is standalone by design -- it serves its own app and logs to its
  # own flash -- so on any installation without Home Assistant the default rebooted it every
  # 15 minutes, forever (APIServer::loop(), "No clients; rebooting"). That cost the in-flight
  # quarter hour every time, marked every stored record as a partial interval after a restart,
  # and kept the live ring from ever holding more than a few minutes.
  # 0s disables it. Home Assistant users lose nothing: this only ever rebooted when HA was absent.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}   # empty still compiles the auth path, just skips the handshake
  # Install from the release (firmware card, Home Assistant update entity): downloads the image
  # named in the manifest into the other app slot, checks its MD5, reboots.
  - platform: http_request

# HTTPS with the ESP-IDF certificate bundle (common CAs). Costs ~126 kB of flash, measured
# 2026-09-25 (firmware/MEMORY.md); used only for the update check and the install.
http_request:
  verify_ssl: true
  timeout: 10s

# `never`: no check at boot and none on a schedule. The device contacts github.io only when the
# user presses "Check for updates" in the app (or asks Home Assistant to check), and installs only
# after an explicit confirmation -- a meter adapter that restarts on its own loses the quarter hour
# in progress. gplug_smi adds the "strictly newer" rule the entity lacks (version_cmp.h).
update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: ${update_manifest}
    update_interval: never

# Timezone pinned: the CSV export (/api/history.csv) prints local interval times and must not
# depend on the timezone of whichever machine compiled the image (ESPHome's default).
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zurich

# HAN input. Pin/baud are defaults only; gplug_smi reconfigures at runtime from the stored descriptor.
uart:
  id: han_uart
  rx_pin: GPIO4
  baud_rate: 115200
  rx_buffer_size: 2048

# SPA and presets default to the copies bundled in the component.
gplug_smi:
  uart_id: han_uart
  ota_password: ${ota_password}
  update_id: fw_update

# Home Assistant entities. A fixed set of well-known quantities, filled every 10 s from whatever the
# meter profile chosen in the setup wizard reads; one the profile lacks stays "unknown" (e.g. tariff
# counters on a gPlugK, per-phase power on the DLMS P1 profiles). Mapping and aliases:
# components/gplug_smi/ha_values.h. Every entry is optional -- drop or rename them in an adopting config.
sensor:
  - platform: gplug_smi
    power:
      name: "Power"
    power_import:
      name: "Power import"
    power_export:
      name: "Power export"
    energy_import:
      name: "Energy import"
    energy_export:
      name: "Energy export"
    energy_import_t1:
      name: "Energy import T1"
    energy_import_t2:
      name: "Energy import T2"
    energy_export_t1:
      name: "Energy export T1"
    energy_export_t2:
      name: "Energy export T2"
    voltage_l1:
      name: "Voltage L1"
    voltage_l2:
      name: "Voltage L2"
    voltage_l3:
      name: "Voltage L3"
    current_l1:
      name: "Current L1"
    current_l2:
      name: "Current L2"
    current_l3:
      name: "Current L3"
    power_l1:
      name: "Power L1"
    power_l2:
      name: "Power L2"
    power_l3:
      name: "Power L3"
    frame_age:
      name: "Last meter frame"
    free_heap:
      name: "Free heap"
    largest_block:
      name: "Largest heap block"
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

text_sensor:
  - platform: gplug_smi
    meter_status:
      name: "Meter status"
    meter_id:
      name: "Meter ID"
